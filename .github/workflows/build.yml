name: Windows build and audio-model tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build native app
        shell: cmd
        run: build.bat
      - name: Install test dependency
        run: python -m pip install numpy
      - name: Render notes and parameter sweeps
        shell: pwsh
        run: |
          $p = Start-Process .\piano.exe -ArgumentList '--test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Note rendering failed' }
          $p = Start-Process .\piano.exe -ArgumentList '--sweep' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Parameter sweep failed' }
          python verify-sound.py
          if ($LASTEXITCODE -ne 0) { throw 'Sound verification failed' }
          python tools/verify-sweep.py
          if ($LASTEXITCODE -ne 0) { throw 'Sweep verification failed' }
      - name: Test physics, transitions and presets
        shell: pwsh
        run: |
          & .\compiler\zig-windows-x86_64-0.13.0\zig.exe cc -O2 engine-validation.c -o engine-validation.exe
          if ($LASTEXITCODE -ne 0) { throw 'Test compilation failed' }
          .\engine-validation.exe
          if ($LASTEXITCODE -ne 0) { throw 'Engine tests failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: piano-material-lab-windows-x64
          path: |
            piano.exe
            README.txt
            MODEL.txt
            CONTROL-GUIDE.txt
            sound-validation.txt
            control-sweep.csv
            engine-validation.txt
